# Reusable: `@claude` on an issue, PR comment or review -> Claude Code works on a branch cut from the
# product's release branch and opens a draft PR against it. Called by a thin claude.yml in each theme repo.
name: Claude (issue to draft PR)

on:
  workflow_call:
    inputs:
      base_branch:
        description: Branch to branch from and open PRs against (the product's release line, e.g. WP)
        type: string
        required: true
      model:
        description: Claude model alias or ID
        type: string
        default: opus
      build_note:
        description: One sentence on how this repo builds or why CI can't (no double quotes)
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    # Humans only: bot comments (including other automation) never start a run.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Issues start from the release branch; PR events let the action check out the PR head itself.
          ref: ${{ (github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request)) && inputs.base_branch || '' }}
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ inputs.base_branch }}
          branch_prefix: claude/
          additional_permissions: |
            actions: read
          claude_args: >-
            --model ${{ inputs.model }}
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git log:*),Bash(git diff:*),Bash(git status:*)"
            --append-system-prompt "This repository ships its product from the ${{ inputs.base_branch }} branch. Work on a branch cut from ${{ inputs.base_branch }}, never push to ${{ inputs.base_branch }} itself, and make the smallest change that resolves the request, following the repository CLAUDE.md. ${{ inputs.build_note }} When the change is pushed, open a draft pull request with gh pr create --draft --base ${{ inputs.base_branch }}; its body says Refs plus the issue number, lists the files touched, and states plainly what you could not verify here (no build, no browser)."
