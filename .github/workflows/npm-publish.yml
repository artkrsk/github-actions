name: Tag & Publish

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      publish:
        description: Run npm publish after tagging
        type: boolean
        default: true
      pnpm-version:
        description: pnpm version (e.g. "latest"); empty uses the caller's packageManager field, or latest when it has none
        type: string
        default: ""
    outputs:
      version:
        description: The version tag (e.g. v1.2.3)
        value: ${{ jobs.tag.outputs.version }}
      created:
        description: Whether a new tag was created
        value: ${{ jobs.tag.outputs.created }}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      created: ${{ steps.check.outputs.created }}
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create tag from package.json version
        id: check
        run: |
          VERSION="v$(jq -r .version package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Created tag $VERSION"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check npm for this version
        id: registry
        if: inputs.publish
        run: |
          SPEC="$(jq -r '.name + "@" + .version' package.json)"
          if [ -n "$(npm view "$SPEC" version 2>/dev/null)" ]; then
            echo "$SPEC is already on npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$SPEC is not on npm yet"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: tag
    # Gated on the registry, not on "tag was just created": a run that failed after tagging
    # can be re-run and still publish.
    if: inputs.publish && needs.tag.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pnpm version
        id: pnpm
        env:
          REQUESTED: ${{ inputs.pnpm-version }}
        # action-setup fails when `version` disagrees with a packageManager pin, so latest is
        # only the fallback for a caller that has neither.
        run: |
          if [ -z "$REQUESTED" ] && ! jq -e '.packageManager' package.json >/dev/null; then
            REQUESTED=latest
          fi
          echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
