name: Tag & Publish

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      publish:
        description: Run npm publish after tagging
        type: boolean
        default: true
      pnpm-version:
        description: pnpm version for callers without a packageManager field (e.g. "latest"); empty reads packageManager
        type: string
        default: ""
    outputs:
      version:
        description: The version tag (e.g. v1.2.3)
        value: ${{ jobs.tag.outputs.version }}
      created:
        description: Whether a new tag was created
        value: ${{ jobs.tag.outputs.created }}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      created: ${{ steps.check.outputs.created }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create tag from package.json version
        id: check
        run: |
          VERSION="v$(jq -r .version package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Created tag $VERSION"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: tag
    if: inputs.publish && needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
